
name: ViT LoRA CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install application dependencies
        run: |
          pip install -r requirements-docker.txt
          pip install pytest ruff

      - name: Check Python syntax
        run: |
          python -m compileall -q app optimization

      - name: Check code with Ruff
        run: |
          ruff check app optimization --select E4,E7,E9,F63,F7,F82

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          else
            echo "No tests directory yet; skipping pytest."
          fi

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check model checkpoint
        id: checkpoint
        run: |
          if [ -f models/quantized_model.pt ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Checkpoint missing; Docker build will be skipped."
          fi

      - name: Build Docker image
        if: steps.checkpoint.outputs.available == 'true'
        run: |
          docker build -t vit-lora-int8:ci .